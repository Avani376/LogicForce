<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="LogicForge architecture: browser workspace calls FastAPI routers which call pure deterministic engines, all constrained by semantics contracts; an optional AI provider powers Sparky's generative mode">
  <defs>
    <linearGradient id="archLane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34c98e"/><stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <pattern id="archGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1d2347" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="900" height="560" rx="16" fill="#0f1226"/>
  <rect width="900" height="560" rx="16" fill="url(#archGrid)" opacity="0.5"/>

  <!-- LANE LABELS -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2">
    <text x="26" y="40" fill="#5b6ee1">CLIENT</text>
    <text x="26" y="240" fill="#34c98e">API</text>
    <text x="26" y="420" fill="#d946ef">ENGINES (pure · deterministic)</text>
  </g>

  <!-- CLIENT LANE -->
  <rect x="110" y="26" width="760" height="180" rx="12" fill="#181c3a" stroke="#2a3158"/>
  <text x="128" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">apps/web — React + Vite workspace</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#c9d0f2">
    <rect x="128" y="66" width="88" height="24" rx="6" fill="#5b6ee1"/><text x="172" y="82" text-anchor="middle">Circuit</text>
    <rect x="224" y="66" width="92" height="24" rx="6" fill="#5b6ee1"/><text x="270" y="82" text-anchor="middle">8086 CPU</text>
    <rect x="324" y="66" width="80" height="24" rx="6" fill="#5b6ee1"/><text x="364" y="82" text-anchor="middle">Verify</text>
    <rect x="412" y="66" width="86" height="24" rx="6" fill="#5b6ee1"/><text x="455" y="82" text-anchor="middle">Explain</text>
    <rect x="506" y="66" width="86" height="24" rx="6" fill="#5b6ee1"/><text x="549" y="82" text-anchor="middle">Visuals</text>
    <rect x="600" y="66" width="150" height="24" rx="6" fill="#3d2a70" stroke="#d946ef"/><text x="675" y="82" text-anchor="middle">Sparky 🧠 chat + settings</text>
  </g>
  <text x="128" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#9fb0ff">renders engine output · never computes results itself</text>
  <text x="128" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#6b7aa8">localStorage holds only the optional AI key — nothing else is persisted</text>
  <rect x="128" y="156" width="420" height="30" rx="8" fill="#0c0f24" stroke="#2a3158"/>
  <text x="140" y="176" font-family="Consolas, monospace" font-size="12" fill="#7ee787">fetch('/api/…') → vite proxy / nginx → :8000</text>

  <!-- flow arrow client → api -->
  <path id="flow1" d="M 490 206 V 232" stroke="#3a427a" stroke-width="2.5" fill="none"/>
  <circle r="4" fill="#ffd166"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#flow1"/></animateMotion></circle>
  <text x="505" y="226" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#9fb0ff">JSON in · JSON + scope label out</text>

  <!-- API LANE -->
  <rect x="110" y="232" width="760" height="150" rx="12" fill="#181c3a" stroke="#2a3158"/>
  <text x="128" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">apps/api — FastAPI · 21 thin endpoints · typed 4xx envelopes</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#c9d0f2">
    <rect x="128" y="272" width="106" height="24" rx="6" fill="#1c2150" stroke="#34c98e"/><text x="181" y="288" text-anchor="middle">/circuits/*</text>
    <rect x="242" y="272" width="106" height="24" rx="6" fill="#1c2150" stroke="#34c98e"/><text x="295" y="288" text-anchor="middle">/sequential · /fsm</text>
    <rect x="356" y="272" width="76" height="24" rx="6" fill="#1c2150" stroke="#34c98e"/><text x="394" y="288" text-anchor="middle">/verify</text>
    <rect x="440" y="272" width="140" height="24" rx="6" fill="#1c2150" stroke="#34c98e"/><text x="510" y="288" text-anchor="middle">/faults · /repair · /optimize</text>
    <rect x="588" y="272" width="130" height="24" rx="6" fill="#1c2150" stroke="#34c98e"/><text x="653" y="288" text-anchor="middle">/8086/* · /8086/pic</text>
    <rect x="128" y="304" width="106" height="24" rx="6" fill="#1c2150" stroke="#34c98e"/><text x="181" y="320" text-anchor="middle">/explain</text>
    <rect x="242" y="304" width="150" height="24" rx="6" fill="#1c2150" stroke="#34c98e"/><text x="317" y="320" text-anchor="middle">/curriculum/*</text>
    <rect x="400" y="304" width="106" height="24" rx="6" fill="#1c2150" stroke="#34c98e"/><text x="453" y="320" text-anchor="middle">/assistant/ask</text>
    <rect x="514" y="304" width="112" height="24" rx="6" fill="#3d2a70" stroke="#d946ef"/><text x="570" y="320" text-anchor="middle">/assistant/chat</text>
  </g>
  <text x="128" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#9fb0ff">routers validate, call engines, map LogicEngineError → 4xx — business logic lives in the engines, not here</text>
  <!-- BYOK side path -->
  <path id="flowByok" d="M 640 352 C 700 372, 760 372, 810 352" stroke="#d946ef" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
  <text x="812" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#d946ef" text-anchor="end">BYOK → OpenAI-compatible provider</text>

  <!-- flow arrow api → engines -->
  <path id="flow2" d="M 490 388 V 414" stroke="#3a427a" stroke-width="2.5" fill="none"/>
  <circle r="4" fill="#34c98e"><animateMotion dur="2.2s" repeatCount="indefinite" begin="0.7s"><mpath href="#flow2"/></animateMotion></circle>
  <text x="505" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#9fb0ff">typed calls · typed errors back</text>

  <!-- ENGINES LANE -->
  <rect x="110" y="414" width="760" height="108" rx="12" fill="#181c3a" stroke="#2a3158"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#c9d0f2">
    <rect x="128" y="430" width="106" height="24" rx="6" fill="#2a1258" stroke="#d946ef"/><text x="181" y="446" text-anchor="middle">logic</text>
    <rect x="242" y="430" width="106" height="24" rx="6" fill="#2a1258" stroke="#d946ef"/><text x="295" y="446" text-anchor="middle">sequential</text>
    <rect x="356" y="430" width="106" height="24" rx="6" fill="#2a1258" stroke="#d946ef"/><text x="409" y="446" text-anchor="middle">verify · explain</text>
    <rect x="470" y="430" width="100" height="24" rx="6" fill="#2a1258" stroke="#d946ef"/><text x="520" y="446" text-anchor="middle">faults · repair</text>
    <rect x="578" y="430" width="100" height="24" rx="6" fill="#2a1258" stroke="#d946ef"/><text x="628" y="446" text-anchor="middle">optimize</text>
    <rect x="686" y="430" width="90" height="24" rx="6" fill="#2a1258" stroke="#d946ef"/><text x="731" y="446" text-anchor="middle">cosim</text>
    <rect x="128" y="462" width="106" height="24" rx="6" fill="#2a1258" stroke="#d946ef"/><text x="181" y="478" text-anchor="middle">cpu8086</text>
    <rect x="242" y="462" width="106" height="24" rx="6" fill="#2a1258" stroke="#d946ef"/><text x="295" y="478" text-anchor="middle">pic8259</text>
    <rect x="356" y="462" width="106" height="24" rx="6" fill="#2a1258" stroke="#d946ef"/><text x="409" y="478" text-anchor="middle">numsys</text>
    <rect x="470" y="462" width="106" height="24" rx="6" fill="#2a1258" stroke="#d946ef"/><text x="523" y="478" text-anchor="middle">boolean · kmap</text>
    <rect x="584" y="462" width="90" height="24" rx="6" fill="#2a1258" stroke="#d946ef"/><text x="629" y="478" text-anchor="middle">curriculum</text>
  </g>
  <text x="128" y="510" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#ffd166">no wall-clock · no randomness · no I/O — same input + same version ⇒ byte-identical output (100× replay tests)</text>

  <!-- contracts base -->
  <rect x="110" y="532" width="760" height="22" rx="8" fill="none" stroke="url(#archLane)" stroke-width="1.5"/>
  <text x="490" y="548" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#9fb0ff" text-anchor="middle">docs/semantics/*.md — 13 normative contracts, written BEFORE the code, enforced by tests</text>
</svg>
