<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="920" height="600" role="img" aria-label="Readable architecture diagram: browser workspace calls FastAPI routers which call twelve pure deterministic engines, constrained by semantics contracts; dashed path shows the optional AI provider">
  <rect width="920" height="600" rx="16" fill="#10142e"/>

  <!-- LANE 1: CLIENT -->
  <rect x="30" y="24" width="860" height="150" rx="12" fill="#1a1f3d" stroke="#5b6ee1" stroke-width="1.5"/>
  <text x="50" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#8a97ff">1 · CLIENT — apps/web (React + Vite)</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e6eaff">
    <rect x="50" y="66" width="92" height="26" rx="6" fill="#2a3158"/><text x="96" y="84" text-anchor="middle">Circuit</text>
    <rect x="150" y="66" width="96" height="26" rx="6" fill="#2a3158"/><text x="198" y="84" text-anchor="middle">8086 CPU</text>
    <rect x="254" y="66" width="84" height="26" rx="6" fill="#2a3158"/><text x="296" y="84" text-anchor="middle">Verify</text>
    <rect x="346" y="66" width="90" height="26" rx="6" fill="#2a3158"/><text x="391" y="84" text-anchor="middle">Explain</text>
    <rect x="444" y="66" width="90" height="26" rx="6" fill="#2a3158"/><text x="489" y="84" text-anchor="middle">Visuals</text>
    <rect x="542" y="66" width="170" height="26" rx="6" fill="#3d2a70"/><text x="627" y="84" text-anchor="middle">Sparky chat + brain settings</text>
  </g>
  <text x="50" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#c9d0f2">Renders engine output only — it never computes a result, runs a simulation, or checks a property.</text>
  <text x="50" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#8a97ff">fetch('/api/…') → vite dev proxy (local) or nginx (Docker) → FastAPI on :8000. Optional AI key lives in localStorage.</text>

  <text x="460" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffd166" text-anchor="middle">▼ JSON request · JSON response with scope label + SHA-256 input hash ▼</text>

  <!-- LANE 2: API -->
  <rect x="30" y="212" width="860" height="170" rx="12" fill="#1a1f3d" stroke="#34c98e" stroke-width="1.5"/>
  <text x="50" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#7ee787">2 · API — apps/api (FastAPI) · 21 thin endpoints · zero business logic</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#e6eaff">
    <rect x="50" y="254" width="120" height="26" rx="6" fill="#15301f"/><text x="110" y="272" text-anchor="middle">/circuits/*</text>
    <rect x="178" y="254" width="150" height="26" rx="6" fill="#15301f"/><text x="253" y="272" text-anchor="middle">/sequential · /fsm/*</text>
    <rect x="336" y="254" width="80" height="26" rx="6" fill="#15301f"/><text x="376" y="272" text-anchor="middle">/verify</text>
    <rect x="424" y="254" width="90" height="26" rx="6" fill="#15301f"/><text x="469" y="272" text-anchor="middle">/faults/*</text>
    <rect x="522" y="254" width="130" height="26" rx="6" fill="#15301f"/><text x="587" y="272" text-anchor="middle">/repair · /optimize</text>
    <rect x="660" y="254" width="150" height="26" rx="6" fill="#15301f"/><text x="735" y="272" text-anchor="middle">/8086/assemble·run·step</text>
    <rect x="50" y="288" width="90" height="26" rx="6" fill="#15301f"/><text x="95" y="306" text-anchor="middle">/8086/pic</text>
    <rect x="148" y="288" width="90" height="26" rx="6" fill="#15301f"/><text x="193" y="306" text-anchor="middle">/explain</text>
    <rect x="246" y="288" width="130" height="26" rx="6" fill="#15301f"/><text x="311" y="306" text-anchor="middle">/curriculum/*</text>
    <rect x="384" y="288" width="120" height="26" rx="6" fill="#15301f"/><text x="444" y="306" text-anchor="middle">/assistant/ask</text>
    <rect x="512" y="288" width="130" height="26" rx="6" fill="#3d2a70"/><text x="577" y="306" text-anchor="middle">/assistant/chat (BYOK)</text>
  </g>
  <text x="50" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#c9d0f2">Routers validate the request (Pydantic), call one engine, and map typed LogicEngineError → 4xx envelope {code, category, message}.</text>
  <text x="50" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#8a97ff">No business logic here on purpose: the API is a thin, testable boundary between the UI and the engines.</text>

  <text x="460" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffd166" text-anchor="middle">▼ typed function calls · typed errors back ▼</text>

  <!-- LANE 3: ENGINES -->
  <rect x="30" y="420" width="860" height="120" rx="12" fill="#1a1f3d" stroke="#d946ef" stroke-width="1.5"/>
  <text x="50" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#f2a4ff">3 · ENGINES — twelve pure, installable packages (engines/*)</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#e6eaff">
    <rect x="50" y="462" width="96" height="26" rx="6" fill="#2a1258"/><text x="98" y="480" text-anchor="middle">logic</text>
    <rect x="154" y="462" width="110" height="26" rx="6" fill="#2a1258"/><text x="209" y="480" text-anchor="middle">sequential</text>
    <rect x="272" y="462" width="130" height="26" rx="6" fill="#2a1258"/><text x="337" y="480" text-anchor="middle">verify · explain</text>
    <rect x="410" y="462" width="130" height="26" rx="6" fill="#2a1258"/><text x="475" y="480" text-anchor="middle">faults · repair</text>
    <rect x="548" y="462" width="96" height="26" rx="6" fill="#2a1258"/><text x="596" y="480" text-anchor="middle">optimize</text>
    <rect x="652" y="462" width="80" height="26" rx="6" fill="#2a1258"/><text x="692" y="480" text-anchor="middle">cosim</text>
    <rect x="740" y="462" width="120" height="26" rx="6" fill="#2a1258"/><text x="800" y="480" text-anchor="middle">pic8259 · numsys</text>
    <rect x="50" y="496" width="96" height="26" rx="6" fill="#2a1258"/><text x="98" y="514" text-anchor="middle">cpu8086</text>
    <rect x="154" y="496" width="140" height="26" rx="6" fill="#2a1258"/><text x="224" y="514" text-anchor="middle">boolean · kmap · QM</text>
    <rect x="302" y="496" width="110" height="26" rx="6" fill="#2a1258"/><text x="357" y="514" text-anchor="middle">curriculum</text>
  </g>
  <text x="50" y="540" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#ffd166">Purity rule: no wall-clock, no randomness, no I/O. Same input + same engine version ⇒ byte-identical output (100× replay tests enforce it).</text>

  <!-- CONTRACTS BASE -->
  <rect x="30" y="556" width="860" height="34" rx="8" fill="#0c0f24" stroke="url(#ag)" stroke-width="1.5"/>
  <linearGradient id="ag" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#34c98e"/><stop offset="0.5" stop-color="#ffd166"/><stop offset="1" stop-color="#d946ef"/>
  </linearGradient>
  <text x="460" y="578" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#e6eaff" text-anchor="middle">FOUNDATION: docs/semantics/*.md — 13 normative contracts written BEFORE the code · tests enforce code ↔ contract agreement</text>

  <!-- OPTIONAL PROVIDER, dashed, clearly outside the core -->
  <path d="M 700 314 C 780 340, 850 340, 890 314" stroke="#d946ef" stroke-width="1.8" fill="none" stroke-dasharray="6 5"/>
  <text x="895" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#f2a4ff" text-anchor="end">dashed = optional:</text>
  <text x="895" y="324" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#f2a4ff" text-anchor="end">BYOK AI provider.</text>
  <text x="895" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#8a97ff" text-anchor="end">Grounding is injected first;</text>
  <text x="895" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#8a97ff" text-anchor="end">replies are labeled generative.</text>
</svg>
