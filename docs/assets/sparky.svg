<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Sparky, the LogicForge mascot">
  <defs>
    <linearGradient id="spBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d7cf0"/>
      <stop offset="1" stop-color="#4a58c9"/>
    </linearGradient>
    <radialGradient id="spGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="150" cy="150" r="130" fill="url(#spGlow)">
    <animate attributeName="r" values="120;142;120" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- bobbing body -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -9; 0 0" dur="2.8s" repeatCount="indefinite"/>
    <!-- antenna -->
    <line x1="150" y1="86" x2="150" y2="62" stroke="#5b6ee1" stroke-width="6" stroke-linecap="round"/>
    <circle cx="150" cy="54" r="10" fill="#ffd166">
      <animate attributeName="r" values="10;12;10" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.55;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <!-- waving arm -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-12 216 130; 16 216 130; -12 216 130" dur="1.4s" repeatCount="indefinite"/>
      <line x1="204" y1="130" x2="238" y2="104" stroke="#5b6ee1" stroke-width="8" stroke-linecap="round"/>
      <circle cx="240" cy="102" r="8" fill="#ffd166"/>
    </g>
    <!-- body -->
    <rect x="86" y="86" width="128" height="112" rx="26" fill="url(#spBody)"/>
    <rect x="98" y="98" width="104" height="88" rx="19" fill="#eef1ff"/>
    <!-- legs -->
    <g stroke="#4a58c9" stroke-width="9" stroke-linecap="round">
      <line x1="118" y1="198" x2="118" y2="212">
        <animate attributeName="y2" values="212;207;212" dur="2.8s" repeatCount="indefinite"/>
      </line>
      <line x1="150" y1="198" x2="150" y2="212"/>
      <line x1="182" y1="198" x2="182" y2="212">
        <animate attributeName="y2" values="207;212;207" dur="2.8s" repeatCount="indefinite"/>
      </line>
    </g>
    <!-- eyes with blink -->
    <g>
      <ellipse cx="132" cy="140" rx="10" ry="11" fill="#2d3561"/>
      <ellipse cx="168" cy="140" rx="10" ry="11" fill="#2d3561"/>
      <circle cx="135" cy="136" r="3.4" fill="#ffffff"/>
      <circle cx="171" cy="136" r="3.4" fill="#ffffff"/>
      <rect x="118" y="126" width="66" height="28" fill="#eef1ff" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.9;0.93;0.96;0.99;1" dur="4.6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- cheeks + mouth -->
    <circle cx="106" cy="156" r="6" fill="#ff8fab" opacity="0.85"/>
    <circle cx="194" cy="156" r="6" fill="#ff8fab" opacity="0.85"/>
    <path d="M 136 166 q 14 12 28 0" stroke="#2d3561" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- cycling speech bubble -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">
    <g>
      <rect x="30" y="24" width="180" height="38" rx="14" fill="#ffffff" stroke="#5b6ee1" stroke-width="2"/>
      <text x="120" y="48" fill="#2d3561" text-anchor="middle">Hi, I'm Sparky!</text>
      <path d="M 190 62 l 10 14 l 4 -14 z" fill="#ffffff" stroke="#5b6ee1" stroke-width="2"/>
      <animate attributeName="opacity" values="1;1;0;0;0;0;0;1" keyTimes="0;0.30;0.36;0.62;0.88;0.94;0.96;1" dur="11s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect x="30" y="24" width="180" height="38" rx="14" fill="#ffffff" stroke="#5b6ee1" stroke-width="2"/>
      <text x="120" y="48" fill="#2d3561" text-anchor="middle">every number is real</text>
      <path d="M 190 62 l 10 14 l 4 -14 z" fill="#ffffff" stroke="#5b6ee1" stroke-width="2"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.38;0.58;0.64;1" dur="11s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect x="30" y="24" width="180" height="38" rx="14" fill="#ffffff" stroke="#5b6ee1" stroke-width="2"/>
      <text x="120" y="48" fill="#2d3561" text-anchor="middle">ask me anything</text>
      <path d="M 190 62 l 10 14 l 4 -14 z" fill="#ffffff" stroke="#5b6ee1" stroke-width="2"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.60;0.66;0.86;0.92;1" dur="11s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
