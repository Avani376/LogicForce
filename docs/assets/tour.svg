<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Animated tour of the five workspace views: Circuit, 8086 CPU, Verify, Explain, Visuals">
  <defs>
    <linearGradient id="tourGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b6ee1"/><stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
  </defs>
  <rect width="900" height="260" rx="16" fill="#0f1226"/>
  <!-- window chrome -->
  <rect x="40" y="26" width="820" height="208" rx="12" fill="#181c3a" stroke="#2a3158"/>
  <circle cx="62" cy="44" r="5" fill="#ff8fab"/><circle cx="78" cy="44" r="5" fill="#ffd166"/><circle cx="94" cy="44" r="5" fill="#34c98e"/>
  <rect x="110" y="37" width="360" height="14" rx="7" fill="#22284d"/>

  <!-- five tabs, highlight cycles every 2.4s -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">
    <g>
      <rect x="70" y="62" width="104" height="26" rx="13" fill="#2a3158">
        <animate attributeName="fill" values="#5b6ee1;#2a3158;#2a3158;#2a3158;#2a3158;#5b6ee1" keyTimes="0;0.18;0.38;0.58;0.78;1" dur="12s" repeatCount="indefinite"/>
      </rect>
      <text x="122" y="80" text-anchor="middle" fill="#ffffff">Circuit</text>
    </g>
    <g>
      <rect x="188" y="62" width="112" height="26" rx="13" fill="#2a3158">
        <animate attributeName="fill" values="#2a3158;#5b6ee1;#2a3158;#2a3158;#2a3158;#2a3158" keyTimes="0;0.02;0.22;0.38;1;1" dur="12s" repeatCount="indefinite"/>
      </rect>
      <text x="244" y="80" text-anchor="middle" fill="#ffffff">8086 CPU</text>
    </g>
    <g>
      <rect x="314" y="62" width="96" height="26" rx="13" fill="#2a3158">
        <animate attributeName="fill" values="#2a3158;#2a3158;#5b6ee1;#2a3158;#2a3158;#2a3158" keyTimes="0;0.2;0.22;0.42;0.58;1" dur="12s" repeatCount="indefinite"/>
      </rect>
      <text x="362" y="80" text-anchor="middle" fill="#ffffff">Verify</text>
    </g>
    <g>
      <rect x="424" y="62" width="104" height="26" rx="13" fill="#2a3158">
        <animate attributeName="fill" values="#2a3158;#2a3158;#2a3158;#5b6ee1;#2a3158;#2a3158" keyTimes="0;0.4;0.42;0.62;0.78;1" dur="12s" repeatCount="indefinite"/>
      </rect>
      <text x="476" y="80" text-anchor="middle" fill="#ffffff">Explain</text>
    </g>
    <g>
      <rect x="542" y="62" width="104" height="26" rx="13" fill="#2a3158">
        <animate attributeName="fill" values="#2a3158;#2a3158;#2a3158;#2a3158;#5b6ee1;#2a3158" keyTimes="0;0.6;0.62;0.82;0.98;1" dur="12s" repeatCount="indefinite"/>
      </rect>
      <text x="594" y="80" text-anchor="middle" fill="#ffffff">Visuals</text>
    </g>
  </g>

  <!-- stage 1: circuit canvas with firing wire -->
  <g>
    <rect x="70" y="106" width="330" height="112" rx="10" fill="#11142e"/>
    <g stroke="#2a3158" stroke-width="2" fill="none">
      <path id="tA" d="M 92 140 H 150 V 168 H 210"/><path d="M 92 178 H 150 V 150 H 210"/>
    </g>
    <rect x="210" y="146" width="42" height="26" rx="6" fill="#5b6ee1"/>
    <text x="231" y="163" font-size="11" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">XOR</text>
    <circle r="4" fill="#ffd166"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#tA"/></animateMotion></circle>
    <rect x="270" y="146" width="60" height="26" rx="6" fill="#1c2150" stroke="#34c98e"/>
    <text x="300" y="163" font-size="11" fill="#34c98e" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">out=1</text>
    <animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.18;0.24;0.94;1;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <!-- stage 2: registers -->
  <g>
    <rect x="70" y="106" width="330" height="112" rx="10" fill="#11142e"/>
    <g font-family="Consolas, monospace" font-size="13" fill="#9fb0ff">
      <text x="100" y="134">AX = 000F</text><text x="100" y="158">BX = 0001</text><text x="100" y="182">CX = 0000</text>
    </g>
    <rect x="240" y="122" width="130" height="70" rx="8" fill="#0c0f24"/>
    <polyline points="252,176 272,176 272,140 292,140 292,176 312,176 312,140 332,140 332,176 352,176" fill="none" stroke="#34c98e" stroke-width="2.5"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.20;0.24;0.40;0.44;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <!-- stage 3: verdict -->
  <g>
    <rect x="70" y="106" width="330" height="112" rx="10" fill="#11142e"/>
    <rect x="120" y="132" width="120" height="42" rx="10" fill="#103b2e" stroke="#34c98e"/>
    <text x="180" y="159" font-size="17" font-weight="800" fill="#34c98e" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">PASS</text>
    <rect x="260" y="132" width="130" height="42" rx="10" fill="#40131a" stroke="#ff8fab"/>
    <text x="325" y="159" font-size="17" font-weight="800" fill="#ff8fab" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">FAIL→fix</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.40;0.44;0.60;0.64;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <!-- stage 4: chat -->
  <g>
    <rect x="70" y="106" width="330" height="112" rx="10" fill="#11142e"/>
    <rect x="96" y="126" width="180" height="34" rx="10" fill="#eef1ff"/>
    <text x="106" y="147" font-size="12" fill="#2d3561" font-family="Segoe UI, Arial, sans-serif">why did the FSM fail?</text>
    <rect x="140" y="170" width="220" height="34" rx="10" fill="#5b6ee1"/>
    <text x="150" y="191" font-size="12" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">counterexample: input 1,0,1 ⚙️</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.60;0.64;0.80;0.84;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <!-- stage 5: donut -->
  <g>
    <rect x="70" y="106" width="330" height="112" rx="10" fill="#11142e"/>
    <circle cx="150" cy="162" r="38" fill="none" stroke="#2a3158" stroke-width="16"/>
    <circle cx="150" cy="162" r="38" fill="none" stroke="#5b6ee1" stroke-width="16" stroke-dasharray="95 344" transform="rotate(-90 150 162)"/>
    <circle cx="150" cy="162" r="38" fill="none" stroke="#d946ef" stroke-width="16" stroke-dasharray="70 369" stroke-dashoffset="-95" transform="rotate(-90 150 162)"/>
    <circle cx="150" cy="162" r="38" fill="none" stroke="#34c98e" stroke-width="16" stroke-dasharray="120 319" stroke-dashoffset="-165" transform="rotate(-90 150 162)"/>
    <g fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12">
      <rect x="230" y="126" width="12" height="12" rx="3" fill="#5b6ee1"/><text x="250" y="137">inputs</text>
      <rect x="230" y="150" width="12" height="12" rx="3" fill="#d946ef"/><text x="250" y="161">gates</text>
      <rect x="230" y="174" width="12" height="12" rx="3" fill="#34c98e"/><text x="250" y="185">outputs</text>
    </g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.80;0.84;0.96;1;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- right rail caption -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="450" y="140" font-size="21" font-weight="800" fill="#ffffff">Five views. One truth.</text>
    <text x="452" y="166" font-size="13.5" fill="#9fb0ff">Every tab renders the same deterministic engines —</text>
    <text x="452" y="186" font-size="13.5" fill="#9fb0ff">scope labels, traces and SHA-256 hashes included.</text>
    <rect x="452" y="204" width="210" height="24" rx="12" fill="none" stroke="url(#tourGrad)" stroke-width="1.6">
      <animate attributeName="stroke-width" values="1.6;2.6;1.6" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="557" y="220" font-size="12.5" font-weight="700" fill="url(#tourGrad)" text-anchor="middle">scroll down for each view ↓</text>
  </g>
</svg>
