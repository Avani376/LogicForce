name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Type check (mypy strict)
        run: mypy engines/logic/logic_engine engines/sequential/sequential_engine engines/verify/verify_engine engines/faults/fault_engine engines/repair/repair_engine engines/optimize/optimize_engine engines/cpu8086/cpu8086 apps/api/logicforge_api
      - name: Tests + coverage gate
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: apps/web
      - name: Build (typecheck + vite)
        run: npm run build
        working-directory: apps/web
