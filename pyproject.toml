# pyproject.toml — LogicForge
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logicforge"
version = "0.1.0"
description = "LogicForge — self-verifying digital system engineering platform (deterministic engines)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.setuptools]
packages = [
  "logic_engine",
  "sequential_engine",
  "verify_engine",
  "fault_engine",
  "repair_engine",
  "optimize_engine",
  "logicforge_api",
  "logicforge_api.routers",
]

[tool.setuptools.package-dir]
logic_engine = "engines/logic/logic_engine"
sequential_engine = "engines/sequential/sequential_engine"
verify_engine = "engines/verify/verify_engine"
fault_engine = "engines/faults/fault_engine"
repair_engine = "engines/repair/repair_engine"
optimize_engine = "engines/optimize/optimize_engine"
logicforge_api = "apps/api/logicforge_api"
"logicforge_api.routers" = "apps/api/logicforge_api/routers"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:logic_engine.*"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["logic_engine", "sequential_engine", "verify_engine", "fault_engine", "repair_engine", "optimize_engine", "logicforge_api"]
branch = true
